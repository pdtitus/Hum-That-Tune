<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hum That Tune</title>
    <link rel="stylesheet" href="style.css">
    <audio id="buzzerSound" src="buzzer.mp3"></audio>
</head>

<body>

<div class="game-container">

  <h1>🎵 BACKTRACK 🎵</h1>
    <h2>70s & 80s Edition</h2>

<div id="scoreboard" class="scoreboard">

    <h3>🏆 SCOREBOARD</h3>

    <div id="scores"></div>

    <div id="roundDisplay"></div>

</div>

  
    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="panel">

        <h3>GAME SETUP</h3>

        <label>
            Teams:
            <select id="teamSelect">
                <option value="2">2 Teams</option>
                <option value="3">3 Teams</option>
                <option value="4">4 Teams</option>
            </select>
        </label>


        <br><br>


        <label>
            Decade:
            <select id="decadeSelect">
                <option value="random">Random</option>
                <option value="70s">70s</option>
                <option value="80s">80s</option>
            </select>
        </label>


        <br><br>


        <label>
            Difficulty:
            <select id="difficultySelect">
                <option value="Mixed">Mixed</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>
        </label>


        <br><br>

<label>
    Game Length:

    <select id="roundSelect">
        <option value="10">10 Rounds</option>
        <option value="20">20 Rounds</option>
        <option value="40">40 Rounds</option>
    </select>

</label>




        <br><br>


        <button id="startButton">
            START GAME
        </button>

    </div>


    <!-- TURN SCREEN -->
    <div id="turnScreen" class="panel hidden">

        <h3 id="teamTurn"></h3>

        <p>
            Pass the computer to the clue giver.
        </p>

        <button id="revealButton">
            REVEAL SONG
        </button>


    </div>


    <!-- SONG SCREEN -->
    <div id="songScreen" class="panel hidden">

        <h3>YOUR SONG</h3>

        <h2 id="songTitle"></h2>

        <p>
            Artist:
            <span id="artist"></span>
        </p>

        <p>
            Year:
            <span id="year"></span>
        </p>

        <p>
            Difficulty:
            <span id="difficulty"></span>
        </p>

        <p>
            Time:
            <span id="timerDisplay">30</span>
        </p>

        <button id="passButton">
         PASS (<span id="passesRemaining">0</span>)
        </button>

        <button id="scoreButton">
        SCORE THIS SONG
        </button>

    </div>

    <!-- SCORING SCREEN -->

<div id="scoringScreen" class="panel hidden">

    <h3>HOW DID THEY DO?</h3>


    <p>
        Song Title:
        <button id="titleCorrect">YES</button>
        <button id="titleWrong">NO</button>
    </p>

    <p>
        Artist:
        <button id="artistCorrect">YES</button>
        <button id="artistWrong">NO</button>
    </p>


    <p>
        Year:
        <button id="yearCorrect">YES</button>
        <button id="yearWrong">NO</button>
    </p>


    <h3>
        Score:
        <span id="roundScore">0</span>
    </h3>


        <button id="nextButton">
        NEXT TEAM
        </button>

</div>


</div>

<script src="app.js"></script>

</body>

</html>
